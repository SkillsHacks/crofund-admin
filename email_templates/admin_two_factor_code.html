<div style="font-family:Arial,sans-serif;background:#f4f7fb;padding:32px 16px;color:#0f172a;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 20px 45px rgba(15,23,42,0.12);">
        <div style="padding:24px 32px;background:linear-gradient(135deg,#0f172a,#059669);color:#ffffff;">
            <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.8;">Administrator Access</p>
            <h1 style="margin:0;font-size:24px;line-height:1.3;">Verify your sign in</h1>
        </div>
        <div style="padding:32px;">
            <p style="margin:0 0 16px;font-size:16px;">Hello {{recipient_name}},</p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#334155;">
                Use the verification code below to complete your sign-in.
            </p>
            <div style="margin:0 0 24px;padding:20px;border-radius:16px;background:#ecfdf5;border:1px solid #a7f3d0;text-align:center;">
                <p style="margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:#047857;">Verification code</p>
                <div style="font-size:34px;font-weight:700;letter-spacing:0.32em;color:#065f46;">{{verification_code}}</div>
            </div>
            <p style="margin:0 0 16px;font-size:14px;color:#475569;">
                This code expires in {{expires_in_minutes}} minutes.
            </p>
            <p style="margin:0;font-size:14px;color:#64748b;">{{company_name}}<br><a href="{{site_url}}" style="color:#059669;text-decoration:none;">{{site_url}}</a></p>
        </div>
    </div>
</div>
