<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
    <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
        <div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:32px;">
            <p style="margin:0 0 16px;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:#059669;font-weight:700;">CroFund donation update</p>
            <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;color:#0f172a;">{{headline}}</h1>
            <p style="margin:0 0 16px;font-size:16px;line-height:1.7;color:#334155;">Hello {{recipient_name}},</p>
            <p style="margin:0 0 16px;font-size:16px;line-height:1.7;color:#334155;">{{message_intro}}</p>
            <div style="margin:24px 0;padding:20px;border-radius:16px;background:#f8fafc;border:1px solid #e2e8f0;">
                <p style="margin:0 0 10px;font-size:14px;color:#64748b;"><strong>Campaign:</strong> {{campaign_title}}</p>
                <p style="margin:0 0 10px;font-size:14px;color:#64748b;"><strong>Donation amount:</strong> ${{donation_amount}}</p>
                <p style="margin:0 0 10px;font-size:14px;color:#64748b;"><strong>Status:</strong> {{donation_status}}</p>
                <p style="margin:0;font-size:14px;color:#64748b;"><strong>Reason:</strong> {{reason}}</p>
            </div>
            <p style="margin:0;font-size:15px;line-height:1.7;color:#334155;">{{message_outro}}</p>
            <p style="margin:24px 0 0;font-size:14px;color:#64748b;">CroFund Support</p>
        </div>
    </div>
</body>
</html>
