<div style="font-family:Arial,sans-serif;background:#f4f7fb;padding:32px 16px;color:#0f172a;">
    <div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 20px 45px rgba(15,23,42,0.12);">
        <div style="padding:24px 32px;background:linear-gradient(135deg,#0f172a,#059669);color:#ffffff;">
            <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;opacity:0.8;">Account Update</p>
            <h1 style="margin:0;font-size:24px;line-height:1.3;">Withdrawal update</h1>
        </div>
        <div style="padding:32px;">
            <p style="margin:0 0 16px;font-size:16px;">Hello {{name}},</p>
            <p style="margin:0 0 14px;font-size:15px;line-height:1.7;color:#334155;">
                Your withdrawal request has been <strong>{{status_label}}</strong>.
            </p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#334155;">{{status_message}}</p>

            <h2 style="margin:0 0 12px;font-size:18px;line-height:1.4;color:#0f172a;">Withdrawal Details</h2>
            <table style="width:100%;border-collapse:collapse;margin:0 0 24px;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;">
                <tr>
                    <th style="border:1px solid #e2e8f0;padding:12px;text-align:left;background:#f8fafc;width:180px;">Amount</th>
                    <td style="border:1px solid #e2e8f0;padding:12px;">${{amount}}</td>
                </tr>
                <tr>
                    <th style="border:1px solid #e2e8f0;padding:12px;text-align:left;background:#f8fafc;">Method</th>
                    <td style="border:1px solid #e2e8f0;padding:12px;">{{method}}</td>
                </tr>
                <tr>
                    <th style="border:1px solid #e2e8f0;padding:12px;text-align:left;background:#f8fafc;">Requested at</th>
                    <td style="border:1px solid #e2e8f0;padding:12px;">{{requested_at}}</td>
                </tr>
                {{details_table_rows}}
            </table>

            <p style="margin:0;font-size:14px;color:#64748b;">{{company_name}}<br><a href="{{site_url}}" style="color:#059669;text-decoration:none;">{{site_url}}</a></p>
        </div>
    </div>
</div>
